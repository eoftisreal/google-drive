name: notebook-app
region: blr
domains:
  - domain: coinrx.me
    type: PRIMARY
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22

services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
      repo: eoftisreal/google-drive
    source_dir: /
    build_command: turbo run build --filter=web
    run_command: npm run start --workspace=web
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: https://api.coinrx.me
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

  - name: api
    github:
      branch: main
      deploy_on_push: true
      repo: eoftisreal/google-drive
    dockerfile_path: /Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: apps-d-1vcpu-2gb
    http_port: 8080
    routes:
      - path: /api
        preserve_path_prefix: true
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: 594124874533-b6cbgem1196fms8i8q9vlbk89rfp4sb1.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: API_URL
        scope: RUN_AND_BUILD_TIME
        value: https://api.coinrx.me
      - key: WEB_URL
        scope: RUN_AND_BUILD_TIME
        value: https://coinrx.me
