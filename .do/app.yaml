name: notebook-app
region: blr

services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
      repo: eoftisreal/google-drive
    source_dir: /
    build_command: turbo run build --filter=web
    run_command: npm run start --workspace=web
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${api.PUBLIC_URL}
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

  - name: api
    github:
      branch: main
      deploy_on_push: true
      repo: eoftisreal/google-drive
    source_dir: /
    build_command: turbo run build --filter=api
    run_command: npm run start:prod --workspace=api
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 8080
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: API_URL
        scope: RUN_TIME
        value: ${APP_URL}/api
      - key: WEB_URL
        scope: RUN_TIME
        value: ${APP_URL}
