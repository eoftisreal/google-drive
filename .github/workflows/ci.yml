name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mediadb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: packages/database

    - name: Push Prisma Schema
      run: npx prisma db push --accept-data-loss
      working-directory: packages/database
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/mediadb?schema=public

    - name: Run Linter
      run: npm run lint

    - name: Run Backend Tests
      run: npm run test
      working-directory: apps/api

    - name: Build Application
      run: npm run build
